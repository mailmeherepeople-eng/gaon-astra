name: Game checks
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            command: npm test
          - group: phones
            command: npm run test:mobile
          - group: speech-performance
            command: npm run test:speech && npm run test:performance
          - group: regressions
            command: node tests/repairs.cjs && node tests/gameplay.cjs && node tests/audit-fixes.cjs && node tests/release.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run complete game checks
        env:
          PLAYWRIGHT_CHANNEL: chromium
          ASTRA_TEST_QUALITY: low
          ASTRA_TEST_RENDER_SCALE: '0.35'
        run: |
          python3 -m http.server 8773 > /tmp/gaon-http.log 2>&1 &
          npm run build
          ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-check-evidence-${{ matrix.group }}
          path: |
            qa/
            audits/repair-results.json
