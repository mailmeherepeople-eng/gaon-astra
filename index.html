<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Gaon Astra · Live the village. Learn civics.</title>
    <meta
      name="description"
      content="A third-person base-building game set in an Indian village. Wake in your house, plan the village at the Panchayat Bhavan, walk the lanes, talk to villagers, be home by dark. Climb from villager to Sarpanch as Lakshmanpur becomes a town."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236a9b4a'/%3E%3Cpath d='M8 20 L16 10 L24 20 Z' fill='%23fff'/%3E%3Crect x='11' y='20' width='10' height='6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #1d2a22;
        --paper: #f4efe3;
        --accent: #c8552e;
        --gold: #e0a63c;
        --blue: #4a7fb5;
        --green: #5f9b52;
        --mute: #6d766f;
        --hud: 64px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #6b8f55;
        overflow: hidden;
        font:
          15px/1.4 "IBM Plex Sans",
          "Segoe UI",
          system-ui,
          sans-serif;
        color: var(--ink);
        touch-action: auto;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas#c {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .lab {
        position: absolute;
        transform: translate(-50%, 0);
        font-size: 11.5px;
        font-weight: 500;
        color: var(--ink);
        background: rgba(244, 239, 227, 0.8);
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
        text-align: center;
        line-height: 1.3;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .lab.warn {
        color: #fff;
        font-weight: 600;
        background: rgba(29, 42, 34, 0.78);
        box-shadow: none;
      }
      .lab.name {
        font-size: 11px;
        background: rgba(29, 42, 34, 0.55);
        color: #f4efe3;
        font-weight: 500;
        box-shadow: none;
      }
      .lab.goal {
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        background: var(--accent);
        padding: 4px 11px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      .lab.goal::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-bottom: 0;
        border-top-color: var(--accent);
      }
      .hud {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        display: flex;
        gap: 6px;
        padding: 8px 68px 8px 10px;
        pointer-events: none;
        flex-wrap: wrap;
        align-items: center;
      }
      .pill {
        background: rgba(244, 239, 227, 0.92);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13.5px;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        display: inline-flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
      }
      .pill b {
        font-weight: 600;
      }
      .pill .lbl {
        color: var(--mute);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .pill .lbl + b + .lbl {
        margin-left: 6px;
        padding-left: 9px;
        border-left: 1px solid rgba(29, 42, 34, 0.15);
      }
      .pill .plus {
        font-size: 12px;
        color: #7a5a12;
        background: rgba(224, 166, 60, 0.35);
        border-radius: 999px;
        padding: 1px 7px;
        margin-left: 2px;
      }
      .pill.rank {
        background: var(--ink);
        color: var(--paper);
      }
      .pill.rank .age {
        color: #c9d3cb;
        font-size: 12.5px;
      }
      .pill.rank .age::before {
        content: "·";
        margin: 0 6px 0 2px;
        color: #7f8c82;
      }
      .pill.warn {
        background: var(--accent);
        color: #fff;
      }
      .clock {
        position: fixed;
        right: 10px;
        top: 8px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: conic-gradient(
          var(--gold) var(--p, 0%),
          rgba(29, 42, 34, 0.35) 0
        );
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #fff;
      }
      .clock.night {
        background: conic-gradient(
          #8fa6f0 var(--p, 0%),
          rgba(29, 42, 34, 0.35) 0
        );
      }
      .clock span {
        background: rgba(29, 42, 34, 0.8);
        border-radius: 50%;
        width: 38px;
        height: 38px;
        display: grid;
        place-content: center;
        text-align: center;
        line-height: 1;
      }
      .clock span b {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .clock span i {
        font-style: normal;
        font-size: 7.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c9d3cb;
        display: block;
        margin-top: 1px;
      }
      .prompt {
        position: fixed;
        left: 50%;
        bottom: calc(84px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: rgba(244, 239, 227, 0.96);
        border-radius: 12px;
        padding: 10px 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        max-width: min(92vw, 440px);
        text-align: center;
        pointer-events: auto;
      }
      .prompt h4 {
        margin: 0 0 2px;
        font-size: 16px;
        font-weight: 600;
      }
      .prompt h4 .tiny {
        font-weight: 400;
      }
      .prompt p {
        margin: 0;
        color: var(--mute);
        font-size: 13px;
      }
      .prompt p.say {
        color: var(--ink);
        font-size: 14px;
        font-style: italic;
      }
      .prompt button {
        margin-top: 8px;
        font: inherit;
        font-weight: 600;
        background: var(--ink);
        color: var(--paper);
        border: 0;
        border-radius: 8px;
        padding: 9px 16px;
        cursor: pointer;
      }
      .prompt button::before {
        content: "E";
        display: inline-block;
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 11px;
        background: rgba(244, 239, 227, 0.25);
        border-radius: 4px;
        padding: 0 5px;
        margin-right: 8px;
      }
      @media (pointer: coarse) {
        .prompt button::before {
          display: none;
        }
      }
      .log {
        position: fixed;
        left: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        width: min(300px, 68vw);
        pointer-events: none;
        font-size: 12.5px;
      }
      .log div {
        background: rgba(29, 42, 34, 0.8);
        color: #f4efe3;
        border-radius: 8px;
        padding: 6px 10px;
        margin-top: 5px;
        animation: fade 8s forwards;
      }
      .log div b {
        color: var(--gold);
      }
      @keyframes fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .stick {
        position: fixed;
        left: 18px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(244, 239, 227, 0.25);
        border: 2px solid rgba(244, 239, 227, 0.5);
        display: none;
      }
      .stick i {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(244, 239, 227, 0.85);
      }
      .act {
        position: fixed;
        right: 18px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        border: 0;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        display: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      }
      .jump {
        position: fixed;
        right: 30px;
        bottom: calc(104px + env(safe-area-inset-bottom));
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(244, 239, 227, 0.92);
        color: var(--ink);
        border: 0;
        font: inherit;
        font-weight: 700;
        font-size: 12px;
        display: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      @media (pointer: coarse) {
        .stick {
          display: block;
        }
        .act {
          display: block;
        }
        .jump {
          display: block;
        }
        .log {
          top: calc(var(--hud) + 6px);
          bottom: auto;
          width: min(280px, 64vw);
        }
        .log div {
          margin-top: 0;
          margin-bottom: 5px;
        }
        .prompt {
          bottom: calc(120px + env(safe-area-inset-bottom));
        }
      }
      @media (max-width: 560px) {
        .hud {
          gap: 4px;
          padding: 6px 64px 6px 8px;
        }
        .pill {
          font-size: 12px;
          padding: 4px 9px;
          gap: 4px;
        }
        .pill .lbl {
          font-size: 10px;
        }
        .pill.rank .age {
          display: none;
        }
        .pill .plus {
          font-size: 11px;
        }
        .clock {
          width: 46px;
          height: 46px;
        }
        .clock span {
          width: 34px;
          height: 34px;
        }
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(29, 42, 34, 0.55);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 10;
      }
      .card {
        background: var(--paper);
        border-radius: 16px;
        padding: 22px 22px 18px;
        max-width: 560px;
        width: 100%;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        max-height: 92vh;
        overflow: auto;
      }
      .card.wide {
        max-width: 900px;
      }
      .card h1 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 32px;
        margin: 0 0 4px;
        line-height: 1.1;
      }
      .card h2 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 24px;
        margin: 0 0 6px;
      }
      .card p {
        margin: 0 0 10px;
        line-height: 1.5;
      }
      .card .sub {
        color: var(--mute);
      }
      .card button {
        font: inherit;
        font-weight: 600;
        background: var(--ink);
        color: var(--paper);
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
      }
      .card button.ghost {
        background: none;
        color: var(--ink);
        border: 1px solid var(--ink);
      }
      .keys {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 14px;
        font-size: 14px;
        margin: 10px 0;
      }
      .keys b {
        font-family: "IBM Plex Mono", Consolas, monospace;
        background: #e8e1d0;
        border-radius: 4px;
        padding: 0 6px;
        font-weight: 500;
      }
      .policies {
        display: grid;
        gap: 10px;
        margin: 12px 0 4px;
      }
      .talkers {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
        display: grid;
        gap: 6px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .talkers li {
        background: #fff;
        border: 1px solid #d8d0bd;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13.5px;
        color: var(--mute);
      }
      .talkers li b {
        color: var(--ink);
      }
      .card .pol.on {
        border-color: var(--accent);
        background: #fbeee8;
      }
      .card .pol {
        border: 2px solid #d8d0bd;
        border-radius: 12px;
        padding: 12px 14px;
        background: #fff;
        cursor: pointer;
        text-align: left;
        width: 100%;
        font: inherit;
        color: var(--ink);
        margin-top: 0;
      }
      .pol:hover {
        border-color: var(--accent);
      }
      .pol h3 {
        margin: 0 0 3px;
        font-size: 16px;
      }
      .pol p {
        margin: 0;
        font-size: 13.5px;
        color: var(--mute);
      }
      .pol .src {
        display: block;
        font-size: 11.5px;
        color: #9a9282;
        margin-top: 4px;
        font-family: "IBM Plex Mono", Consolas, monospace;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        font-size: 14px;
        margin: 8px 0 12px;
      }
      .stats span:nth-child(even) {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .tiny {
        font-size: 12.5px;
        color: var(--mute);
      }
      .hidden {
        display: none !important;
      }
      .plan {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 14px;
      }
      .map {
        position: relative;
        background: #d3e2bc;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 2250/1450;
        border: 2px solid #b9caa2;
        cursor: pointer;
      }
      .map canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .side h3 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 20px;
        margin: 0 0 4px;
      }
      .side .desc {
        font-size: 13.5px;
        color: var(--mute);
        min-height: 60px;
      }
      .side .cost {
        font-weight: 600;
        color: var(--accent);
        margin: 6px 0;
      }
      .side .hint {
        font-size: 12px;
        color: #9a9282;
        margin: 10px 0 0;
      }
      .queue {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        font-size: 13.5px;
      }
      .queue li {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #e2dccd;
      }
      .queue li b {
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-weight: 500;
      }
      @media (max-width: 700px) {
        .plan {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .side {
          order: -1;
        }
        .side .desc {
          min-height: 0;
        }
        .side .hint {
          display: none;
        }
        .card {
          padding: 16px 14px 14px;
        }
        .card.wide {
          max-height: 94vh;
        }
      }
      .fade {
        position: fixed;
        inset: 0;
        background: #05070c;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 8;
      }
      .fade.on {
        opacity: 1;
      }
      .place {
        position: fixed;
        left: 50%;
        top: calc(var(--hud) + 8px);
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.03em;
        color: var(--paper);
        background: rgba(29, 42, 34, 0.7);
        padding: 3px 11px;
        border-radius: 999px;
        pointer-events: none;
      }
      .tip {
        position: fixed;
        right: 14px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        font-size: 12px;
        color: var(--paper);
        background: rgba(29, 42, 34, 0.6);
        padding: 4px 10px;
        border-radius: 999px;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      @media (pointer: coarse) {
        .tip {
          display: none;
        }
      }
      .sleep {
        position: fixed;
        inset: 0;
        background: rgba(10, 16, 32, 0.55);
        display: grid;
        place-items: center;
        z-index: 9;
        pointer-events: none;
        color: #f4efe3;
        font-family: "Newsreader", Georgia, serif;
        font-size: 26px;
        text-align: center;
      }
      .sleep small {
        display: block;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 14px;
        color: #c8d0dc;
        margin-top: 6px;
      }
    </style>
    <link rel="stylesheet" href="astra.css?v=4a91af26b335ed5f" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="hud" id="hud"></div>
    <div class="clock" id="clock">
      <span><b id="clockN">1</b><i id="clockP">day</i></span>
    </div>
    <div class="prompt hidden" id="prompt"></div>
    <div class="log" id="log"></div>
    <div class="stick" id="stick"><i id="knob"></i></div>
    <button class="jump" id="jumpBtn">Jump</button>
    <button class="act" id="act" aria-label="Use nearby object or talk">
      Use
    </button>
    <div class="fade" id="fade"></div>
    <div class="place hidden" id="place"></div>
    <div class="tip" id="tip">
      Click the village to look around · scroll to zoom · E to talk and use ·
      Space to jump
    </div>
    <div class="sleep hidden" id="sleep">
      Sleeping<small id="sleepNote"></small>
    </div>
    <div class="overlay" id="overlay"></div>
    <script src="boot.js?v=91bdba2c769c9978"></script>
    <script src="vendor/three.min.js?v=ca8ff8a838e1a8eb"></script>
    <script src="game.js?v=2d6762fbfca871d3"></script>
    <script src="audio.js?v=fc5430e1bbdeadfa"></script>
    <script src="lessons.js?v=1d72eac5836ac95a"></script>
    <script src="astra.js?v=04daa36df5139cab"></script>
    <script src="world-art.js?v=56fa155098f8de5a"></script>
    <script src="persistence.js?v=bd571b7acf837a04"></script>
    <script src="village-life.js?v=d82340fb02463fd2"></script>
    <script src="mobile-ui.js?v=7b7a263fd47c7d5c"></script>
    <script src="speech-ui.js?v=a47d66391030dfc9"></script>
    <script src="quality.js?v=64794b8618c5c178"></script>
    <script src="village-story.js?v=876ef89cb35830b1"></script>
  </body>
</html>
