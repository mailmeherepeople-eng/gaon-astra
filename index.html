<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gaon Astra · Live the village. Learn civics.</title>
<meta name="description" content="A third-person base-building game set in an Indian village. Wake in your house, plan the village at the Panchayat Bhavan, walk the lanes, talk to villagers, be home by dark. Climb from villager to Sarpanch as Lakshmanpur becomes a town.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236a9b4a'/%3E%3Cpath d='M8 20 L16 10 L24 20 Z' fill='%23fff'/%3E%3Crect x='11' y='20' width='10' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--ink:#1d2a22;--paper:#f4efe3;--accent:#c8552e;--gold:#e0a63c;--blue:#4a7fb5;--green:#5f9b52;--mute:#6d766f;--hud:64px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#6b8f55;overflow:hidden;font:15px/1.4 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{display:block;width:100vw;height:100vh}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,0);font-size:11.5px;font-weight:500;color:var(--ink);background:rgba(244,239,227,.8);padding:2px 8px;border-radius:999px;white-space:nowrap;text-align:center;line-height:1.3;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lab.warn{color:#fff;font-weight:600;background:rgba(29,42,34,.78);box-shadow:none}
.lab.name{font-size:11px;background:rgba(29,42,34,.55);color:#f4efe3;font-weight:500;box-shadow:none}
.lab.goal{color:#fff;font-weight:600;font-size:13px;background:var(--accent);padding:4px 11px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.lab.goal::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--accent)}
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px 68px 8px 10px;pointer-events:none;flex-wrap:wrap;align-items:center}
.pill{background:rgba(244,239,227,.92);border-radius:999px;padding:5px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.15);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill b{font-weight:600}
.pill .lbl{color:var(--mute);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.pill .lbl+b+.lbl{margin-left:6px;padding-left:9px;border-left:1px solid rgba(29,42,34,.15)}
.pill .plus{font-size:12px;color:#7a5a12;background:rgba(224,166,60,.35);border-radius:999px;padding:1px 7px;margin-left:2px}
.pill.rank{background:var(--ink);color:var(--paper)}
.pill.rank .age{color:#c9d3cb;font-size:12.5px}
.pill.rank .age::before{content:"·";margin:0 6px 0 2px;color:#7f8c82}
.pill.warn{background:var(--accent);color:#fff}
.clock{position:fixed;right:10px;top:8px;width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(29,42,34,.35) 0);box-shadow:0 2px 6px rgba(0,0,0,.2);display:grid;place-items:center;pointer-events:none;color:#fff}
.clock.night{background:conic-gradient(#8fa6f0 var(--p,0%),rgba(29,42,34,.35) 0)}
.clock span{background:rgba(29,42,34,.8);border-radius:50%;width:38px;height:38px;display:grid;place-content:center;text-align:center;line-height:1}
.clock span b{font-size:14px;font-weight:600;display:block}
.clock span i{font-style:normal;font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:#c9d3cb;display:block;margin-top:1px}
.prompt{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(244,239,227,.96);border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:min(92vw,440px);text-align:center;pointer-events:auto}
.prompt h4{margin:0 0 2px;font-size:16px;font-weight:600}
.prompt h4 .tiny{font-weight:400}
.prompt p{margin:0;color:var(--mute);font-size:13px}
.prompt p.say{color:var(--ink);font-size:14px;font-style:italic}
.prompt button{margin-top:8px;font:inherit;font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.prompt button::before{content:"E";display:inline-block;font-family:"IBM Plex Mono",Consolas,monospace;font-size:11px;background:rgba(244,239,227,.25);border-radius:4px;padding:0 5px;margin-right:8px}
@media(pointer:coarse){.prompt button::before{display:none}}
.log{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:min(300px,68vw);pointer-events:none;font-size:12.5px}
.log div{background:rgba(29,42,34,.8);color:#f4efe3;border-radius:8px;padding:6px 10px;margin-top:5px;animation:fade 8s forwards}
.log div b{color:var(--gold)}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
.stick{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(244,239,227,.25);border:2px solid rgba(244,239,227,.5);display:none}
.stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(244,239,227,.85)}
.act{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;background:var(--accent);color:#fff;border:0;font:inherit;font-weight:700;font-size:14px;display:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.jump{position:fixed;right:30px;bottom:calc(104px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:rgba(244,239,227,.92);color:var(--ink);border:0;font:inherit;font-weight:700;font-size:12px;display:none;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@media(pointer:coarse){.stick{display:block}.act{display:block}.jump{display:block}.log{top:calc(var(--hud) + 6px);bottom:auto;width:min(280px,64vw)}.log div{margin-top:0;margin-bottom:5px}.prompt{bottom:calc(120px + env(safe-area-inset-bottom))}}
@media(max-width:560px){.hud{gap:4px;padding:6px 64px 6px 8px}.pill{font-size:12px;padding:4px 9px;gap:4px}.pill .lbl{font-size:10px}.pill.rank .age{display:none}.pill .plus{font-size:11px}.clock{width:46px;height:46px}.clock span{width:34px;height:34px}}
.overlay{position:fixed;inset:0;background:rgba(29,42,34,.55);display:grid;place-items:center;padding:16px;z-index:10}
.card{background:var(--paper);border-radius:16px;padding:22px 22px 18px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.card.wide{max-width:900px}
.card h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:32px;margin:0 0 4px;line-height:1.1}
.card h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:24px;margin:0 0 6px}
.card p{margin:0 0 10px;line-height:1.5}
.card .sub{color:var(--mute)}
.card button{font:inherit;font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;width:100%;margin-top:8px}
.card button.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;margin:10px 0}
.keys b{font-family:"IBM Plex Mono",Consolas,monospace;background:#e8e1d0;border-radius:4px;padding:0 6px;font-weight:500}
.policies{display:grid;gap:10px;margin:12px 0 4px}
.talkers{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.talkers li{background:#fff;border:1px solid #d8d0bd;border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--mute)}
.talkers li b{color:var(--ink)}
.card .pol.on{border-color:var(--accent);background:#fbeee8}
.card .pol{border:2px solid #d8d0bd;border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--ink);margin-top:0}
.pol:hover{border-color:var(--accent)}
.pol h3{margin:0 0 3px;font-size:16px}
.pol p{margin:0;font-size:13.5px;color:var(--mute)}
.pol .src{display:block;font-size:11.5px;color:#9a9282;margin-top:4px;font-family:"IBM Plex Mono",Consolas,monospace}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:8px 0 12px}
.stats span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tiny{font-size:12.5px;color:var(--mute)}
.hidden{display:none!important}
.plan{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.map{position:relative;background:#d3e2bc;border-radius:12px;overflow:hidden;aspect-ratio:2250/1450;border:2px solid #b9caa2;cursor:pointer}
.map canvas{width:100%;height:100%;display:block}
.side h3{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:20px;margin:0 0 4px}
.side .desc{font-size:13.5px;color:var(--mute);min-height:60px}
.side .cost{font-weight:600;color:var(--accent);margin:6px 0}
.side .hint{font-size:12px;color:#9a9282;margin:10px 0 0}
.queue{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.queue li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2dccd}
.queue li b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
@media(max-width:700px){.plan{grid-template-columns:1fr;gap:10px}.side{order:-1}.side .desc{min-height:0}.side .hint{display:none}.card{padding:16px 14px 14px}.card.wide{max-height:94vh}}
.fade{position:fixed;inset:0;background:#05070c;opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
.fade.on{opacity:1}
.place{position:fixed;left:50%;top:calc(var(--hud) + 8px);transform:translateX(-50%);font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--paper);background:rgba(29,42,34,.7);padding:3px 11px;border-radius:999px;pointer-events:none}
.tip{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;color:var(--paper);background:rgba(29,42,34,.6);padding:4px 10px;border-radius:999px;pointer-events:none;transition:opacity .6s}
@media(pointer:coarse){.tip{display:none}}
.sleep{position:fixed;inset:0;background:rgba(10,16,32,.55);display:grid;place-items:center;z-index:9;pointer-events:none;color:#f4efe3;font-family:"Newsreader",Georgia,serif;font-size:26px;text-align:center}
.sleep small{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:14px;color:#c8d0dc;margin-top:6px}
</style>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="hud" id="hud"></div>
<div class="clock" id="clock"><span><b id="clockN">1</b><i id="clockP">day</i></span></div>
<div class="prompt hidden" id="prompt"></div>
<div class="log" id="log"></div>
<div class="stick" id="stick"><i id="knob"></i></div>
<button class="jump" id="jumpBtn">Jump</button>
<button class="act" id="act">E</button>
<div class="fade" id="fade"></div>
<div class="place hidden" id="place"></div>
<div class="tip" id="tip">Click the village to look around · scroll to zoom · E to talk and use · Space to jump</div>
<div class="sleep hidden" id="sleep">Sleeping<small id="sleepNote"></small></div>
<div class="overlay" id="overlay"></div>
<script src="vendor/three.min.js"></script>
<script>
/* ============================================================
   GAON 3D · third-person base builder · civics + economics, Class 6
   Loop: wake at home, walk to the Panchayat Bhavan, collect the day's
   coins from the chest, plan on the land map, watch construction rise
   by day, be home and asleep by dark. Nights bring problems.
   ============================================================ */
if(!window.THREE){document.body.innerHTML='<div class="overlay"><div class="card"><h2>Three.js did not load</h2><p>This version needs an internet connection once for the 3D library.</p></div></div>';throw new Error('no THREE');}
const W=2600,H=1900;const U=x=>x/10;
const RIVER={x:2150,w:130};const BRIDGE_Y=950;
const VC={x:1250,y:930};  // the chowk under the banyan

// ---------- content ----------
const B={
  home:{n:'Your house',cost:0,sector:'H',desc:'Where you sleep. Be inside by dark.',rank:0},
  homeM:{n:"Panchayat member's house",cost:0,sector:'H',desc:'Quarters for an elected member of the Gram Panchayat, by the south lane.',rank:0},
  homeS:{n:"Sarpanch's house",cost:0,sector:'H',desc:'The Sarpanch lives here: Kamla Devi, until the Sabha chooses someone else.',rank:0},
  house:{n:'House',cost:20,sector:'H',desc:'Two more villagers move in. People are workers and voters.',rank:0},
  field:{n:'Wheat field',cost:15,sector:'P',desc:'Primary sector: grain straight from nature. Needs one worker.',rank:0},
  dairy:{n:'Dairy shed',cost:25,sector:'P',desc:'Cows give milk. Milk spoils by evening unless it reaches a market or a dairy plant.',rank:0},
  well:{n:'Well and tank',cost:20,sector:'C',desc:'Water for people and fields. Softens drought and small floods.',rank:0},
  forest:{n:'Wood lot',cost:15,sector:'P',desc:'Primary sector: timber. Feeds the workshop.',rank:0},
  mill:{n:'Flour mill',cost:40,sector:'S',desc:'Secondary sector: grain becomes flour, worth double. Needs grain and a worker.',rank:1},
  workshop:{n:'Furniture workshop',cost:45,sector:'S',desc:'Wood bought at 600 becomes a chair sold at 1,000. The 400 is value added by skill and effort.',rank:1},
  market:{n:'Market',cost:35,sector:'T',desc:'Tertiary sector: goods sell at full price. Without it the middleman pays half.',rank:0},
  road:{n:'Village road',cost:10,sector:'T',desc:'Everyone walks faster; goods reach the market before they spoil.',rank:1},
  school:{n:'Primary school',cost:40,sector:'T',desc:'Teachers are a tertiary service. Children in school lift happiness, and the town needs it.',rank:1},
  clinic:{n:'Health sub-centre',cost:45,sector:'T',desc:'Public health is a State function delivered locally. Stops sickness at night.',rank:2},
  bins:{n:'Waste bins',cost:12,sector:'C',desc:'Plastic on the roadside stops piling up, if people also segregate their waste.',rank:1},
  patwari:{n:'Patwari\'s office',cost:30,sector:'C',desc:'The Patwari keeps land records and maps generations old. Settles boundary disputes before they turn into fights.',rank:1},
  police:{n:'Police post',cost:0,sector:'C',desc:'Police, law and order is a State matter. Only the Sarpanch can petition the State for a post. Once it stands, night thieves are caught.',rank:2,petition:'State Government',days:2},
  embank:{n:'Embankment',cost:0,sector:'C',desc:'River flood protection, funded through the Panchayat Samiti at block level.',rank:2,petition:'Panchayat Samiti',days:2},
  panchayat:{n:'Panchayat Bhavan',cost:0,sector:'C',desc:'Where you collect the day\'s coins, plan the land, and where the Gram Sabha votes.',rank:0},
};
const AGES=[
  {n:'Hamlet',need:{pop:0},unlock:'You are one voter among the adults of the Gram Sabha.'},
  {n:'Gram Panchayat village',need:{pop:24,b:['panchayat','well']},unlock:'A village council is closest to the people. Public works open up.'},
  {n:'Nagar Panchayat town',need:{pop:44,b:['market','school','road']},unlock:'Small towns get a Nagar Panchayat. Wards, property tax and city services come next.'},
  {n:'Municipal Council city',need:{pop:60,b:['clinic','mill']},unlock:'Between 1 and 10 lakh people a city has a Municipal Council (Nagar Palika). Prototype ends here.'},
];
const RANKS=[
  {n:'Villager',sub:'member of the Gram Sabha',can:'Help your neighbours and earn their trust before standing for election.'},
  {n:'Panchayat member',sub:'elected by the Gram Sabha',can:'Public works: roads, school, bins, mill, workshop and the Patwari\'s office. Vote on policies.'},
  {n:'Sarpanch',sub:'head of the Gram Panchayat',can:'Petition the block and the State: police post, embankment, health sub-centre. Chair the Gram Sabha.'},
  {n:'Panchayat Samiti member',sub:'block level',can:'Link villages, all-weather roads under PMGSY, coordinate plans for the district.'},
];
const POLICIES=[
  {id:'coop',n:'Dairy cooperative',p:'Farmers sell milk as a group. The middleman is gone; milk fetches full price and never spoils on the way.',src:'Ch 14, AMUL, pp. 202 to 205',ok:s=>s.count('dairy')>0},
  {id:'rain',n:'Rainwater harvesting',p:'Hiware Bazar\'s method: tanks and watershed work. Drought and small floods do half the damage.',src:'Ch 11, p. 166'},
  {id:'women',n:'One-third seats for women',p:'Reserved seats bring the whole village into the Sabha. Happiness rises and elections are easier to win.',src:'Ch 11, p. 169'},
  {id:'bal',n:'Bal Sabha',p:'Children get a forum. They spot low wires, leaks and thieves first: you get a warning before each night\'s problem.',src:'Ch 11, p. 167'},
  {id:'segregate',n:'Waste segregation drive',p:'Citizens sort wet and dry waste at home. Bins actually work; plastic stops piling up.',src:'Ch 12, p. 177',ok:s=>s.count('bins')>0},
  {id:'langar',n:'Community kitchen (seva)',p:'Non-economic activity: villagers cook for everyone at festivals. No coins change hands, but happiness rises every day.',src:'Ch 13, pp. 191 to 192'},
  {id:'watch',n:'Night watch',p:'Neighbours take turns watching the fields. A community matter, not a government one. Thieves flee when the watch is up, but tired watchers lower happiness a little.',src:'Ch 9, p. 145'},
  {id:'midday',n:'Mid-day meal kitchen',p:'A kitchen in the school, as in Sangkhu Radhu Khandu Panchayat. More children attend; population grows faster.',src:'Ch 11, p. 168',ok:s=>s.count('school')>0},
  {id:'wage',n:'Pay in kind',p:'Part of a worker\'s wage is paid in mangoes and grain instead of cash. Coins last longer, but grain stocks drop.',src:'Ch 13, p. 189'},
  {id:'tax',n:'Property tax',p:'Urban local bodies collect local taxes to fund services. Steady coins each dawn, a little grumbling.',src:'Ch 12, pp. 176, 178',age:2},
];
const NOTES={
  spoil:'<b>Milk spoiled.</b> It curdles in the heat before reaching a market. The Anand farmers had the same problem before AMUL.',
  middle:'<b>The middleman</b> bought your goods at half price. No market, no choice. A cooperative or a market fixes this.',
  value:'<b>Value added.</b> Wood in at 600, chair out at 1,000: the 400 is skill, time and effort.',
  thiefDay:'<b>You caught him in daylight,</b> with half the village watching. Thieves learn: from now on they come at night, and only the police can catch them then.',
  thiefNoPolice:'<b>Too dark, too fast.</b> Catching thieves at night is police work, a State matter. A Sarpanch can petition for a post.',
  thiefCaught:'<b>The police post caught the thief.</b> The court will decide the rest.',
  floodSmall:'<b>Two lanes waterlogged.</b> Small enough for the village to handle: a well and tank drains it.',
  floodBig:'<b>The river is over the fields.</b> Bigger than one village. The State sends help, but an embankment through the block would have stopped it.',
  election:'<b>Gram Sabha.</b> Every adult votes. Your approval decides your rank.',
  age1:'<b>Lakshmanpur is a Gram Panchayat village.</b> Members are elected by the Gram Sabha; the head is the Sarpanch.',
  age2:'<b>Lakshmanpur is a town.</b> Towns below 1 lakh get a Nagar Panchayat. You will need wards, taxes and services.',
  sick:'<b>Fever in three houses.</b> Public health is a State function; a health sub-centre stops it.',
  plastic:'<b>Plastic on the roadside.</b> Bins help, but only if people sort their waste.',
  seva:'<b>Seva</b> at the community kitchen: no money changes hands, and the village is happier for it.',
  dispute:'<b>Two families are shouting over a field boundary.</b> Only the Patwari\'s records can say where the line runs.',
  disputeOk:'<b>The Patwari\'s old map settled it.</b> The stones go back where the record says.',
  late:'<b>You slept in the field.</b> Cold, tired, and the village noticed.',
  doze:'<b>Villagers must be indoors after the lamps go out.</b> You doze off. Watch the night.',
  skipped:'<b>The Sabha met without you.</b> Decisions were taken; nobody knew your view.',
};
// Everyone in Lakshmanpur has a name and a job. The first six speak at the night Sabha.
const NAMES=[{n:'Ramesh',job:'farmer'},{n:'Meera Devi',job:'keeps cows'},{n:'Bhagwati',job:'elder'},{n:'Suraj',job:'young, wants work'},{n:'Hari Singh',job:'shopkeeper'},{n:'Anita',job:'student'},{n:'Gopal',job:'potter'},{n:'Sunita Devi',job:'anganwadi worker'},{n:'Mohan',job:'carpenter'},{n:'Radha',job:'weaver'},{n:'Dinesh',job:'mason'},{n:'Lakshmi',job:'midwife'},{n:'Prakash',job:'teacher'},{n:'Savitri',job:'farmer'},{n:'Raju',job:'schoolboy'},{n:'Geeta Devi',job:'runs the women\'s group'},{n:'Bhola',job:'drives the tractor'},{n:'Kishan',job:'herds goats'},{n:'Pooja',job:'student'},{n:'Naresh',job:'milkman'}];
const VILLAGERS=NAMES.slice(0,6);
const NPC_SARPANCH='Kamla Devi';

// ---------- state ----------
const S={
  day:1,t:0,phase:'day',dayLen:120,nightLen:80,scene:'village',room:null,inside:{x:0,z:0,face:Math.PI},transition:false,talking:null,homeId:'home',res:{},
  coins:0,treasury:80,grain:8,milk:0,wood:0,flour:0,chairs:0,pop:15,happy:55,approval:40,
  rank:0,age:0,policies:[],petitions:[],
  buildings:[],problems:[],villagers:[],
  player:{x:1250,y:1140,face:0,jy:0,vy:0},
  keys:{},paused:true,warned:[],night:0,asleep:false,collected:false,dayThiefDone:false,sabhaDone:true,awake:0,reported:[],subsidy:null,resolution:null,
  count(id){return this.buildings.filter(b=>b.id===id&&!b.under).length;},
  has(id){return this.policies.includes(id);}
};
const PLOTS=[
  {x:1250,y:680,id:'panchayat',built:true},
  {x:1250,y:1090,id:'home',built:true},

function talkLine(who){
  const P=proposals();const pr=P.find(p=>p.by===who.n);if(pr&&S.phase==='night')return pr.why;
  const pool=[];
  if(S.problems.some(p=>p.k==='sick'))pool.push('Fever in the houses near the well. Someone should send for the doctor.');
  if(S.problems.some(p=>p.k==='flood'))pool.push('The river is up again. An embankment needs the block office, not us.');
  if(S.problems.some(p=>p.k==='thief'))pool.push('A stranger was seen by the fields. Keep your grain inside tonight.');
  if(!S.count('market'))pool.push('The middleman came again. Half price for our grain, and what choice do we have?');
  if(!S.count('school'))pool.push('The children walk to the next village for school. Two hours each way.');
  if(!S.count('well'))pool.push('The tank is dry by noon. A proper well would change everything.');

  if(S.has('women'))pool.push('Geeta Devi sits in the Sabha now. About time.');
  if(S.grain<=2)pool.push('The store is nearly empty. People will go hungry at dawn.');
  const byJob={farmer:['The wheat is thin this year.','One tractor for the whole village, that is what we need.'],'keeps cows':['Milk spoils by evening unless it reaches the market.','My cows know me better than my children do.'],elder:['In my day the Sabha met under the banyan. Still does, in a way.','Every adult has a vote. Use it.'],shopkeeper:['A market of our own, and nobody pays the middleman.','Property tax? In a village? Wait till we are a town.'],student:['I want to be the District Collector.','The school needs a wall. Goats keep coming in.'],schoolboy:['Raju is not my full name. It is Rajesh Kumar, but nobody says it.','I can run to the bridge and back before you finish that sentence.'],teacher:['Mid-day meals bring the children in. Hungry children cannot learn.','Chapter eleven. Gram Panchayat, Panchayat Samiti, Zila Parishad. Say it back.'],potter:['Clay from the pond, sun from the sky, and my hands. Primary sector, the teacher says.','A pot sells for ten. The clay cost nothing. Think about that.'],carpenter:['Wood in at 600, a chair out at 1,000. The rest is my hands.','Give me a workshop and I will give you furniture for the whole block.'],midwife:['A health sub-centre is a State matter, but fever does not wait for the State.','Three births this year. All at home, all at night.'],mason:['Every house here I built or my father did.','Bricks from the kiln across the river. The bridge saves me an hour a day.'],weaver:['The market pays double what the middleman does. I have counted.','My loom is older than the Panchayat.'],'anganwadi worker':['The children are weighed every month. The State pays for that much.','Segregate your waste, I keep telling them. Wet in one, dry in the other.'],'young, wants work':['No mill, no workshop, no work. I may go to the city.','Give me a job and I will vote for you twice. Once is legal.'],'runs the women\'s group':['One-third of the seats are ours by law. We would like them in practice.','The self-help group lends at two percent. The moneylender wants ten.'],'drives the tractor':['The lane sinks every monsoon. A pucca road, that is what I want.','Diesel is dearer every year.'],'herds goats':['The goats got into the school yard again.','Nobody counts goats in the census. I do.'],milkman:['Six houses on my round. Without a cooperative the milk is worth half.','The bridge is the best thing the Panchayat ever built.']};
  pool.push(...(byJob[who.job]||['Nights are getting cold.','My cousin in the city says they have a Nagar Palika.']));
  return pool[(S.day*7+(who.i||0)*3+S.night)%pool.length];
}

// ---------- economy at dawn (coins go to the Panchayat treasury) ----------
function dawn(){
  S.problems=[];S.collected=false;S.asleep=false;document.getElementById('sleep').classList.add('hidden');
  if(S.scene==='interior')leaveRoom(true);S.player.x=HOME.x;S.player.y=HOME.y+DOOR_OFF[HOME.id]+10;S.player.face=Math.PI;
  const workers=Math.max(0,S.pop-2);let jobs=0,report=[];
  const use=n=>{if(jobs+n<=workers){jobs+=n;return true;}return false;};
  let grain=0,milk=0,wood=0;
  S.buildings.forEach(b=>{if(b.hp<1||b.under)return;
    if(b.id==='field'&&use(1))grain+=S.count('well')?6:5;
    if(b.id==='dairy'&&use(1))milk+=3;
    if(b.id==='forest'&&use(1))wood+=2;});
  if(S.has('rain')&&S.count('well'))grain+=1;
  S.grain+=grain;S.milk+=milk;S.wood+=wood;
  let flour=0,chairs=0;
  S.buildings.forEach(b=>{if(b.hp<1||b.under)return;
    if(b.id==='mill'&&use(1)){const g=Math.min(4,S.grain);S.grain-=g;flour+=g;}
    if(b.id==='workshop'&&use(1)){const w=Math.min(2,S.wood);S.wood-=w;chairs+=w;}});
  S.flour+=flour;S.chairs+=chairs;if(chairs&&!S.warned.includes('value')){S.warned.push('value');log(NOTES.value);}
  const eat=Math.ceil(S.pop/4);if(S.grain>=eat){S.grain-=eat;}else{S.happy-=6;report.push('Not enough grain: people went hungry');S.grain=0;}
  const market=S.count('market')>0;const road=S.count('road')>0;
  let income=0;const price={grain:4,flour:8,wood:4,chairs:12,milk:4};
  const sell=(k,amt)=>{const full=amt*price[k];if(market){income+=full;}else{income+=Math.floor(full/2);}};
  if(S.milk){if(market||S.has('coop')||road){if(S.has('coop'))income+=S.milk*price.milk;else sell('milk',S.milk);}else{log(NOTES.spoil);}S.milk=0;}
  const surplusGrain=Math.max(0,S.grain-4);if(surplusGrain){sell('grain',surplusGrain);S.grain-=surplusGrain;}
  if(S.flour){sell('flour',S.flour);S.flour=0;}
  if(S.chairs){sell('chairs',S.chairs);S.chairs=0;}
  if(S.wood>4){sell('wood',S.wood-4);S.wood=4;}
  if(!market&&income>0&&!S.warned.includes('middle')){S.warned.push('middle');log(NOTES.middle);}
  if(S.has('tax')){income+=S.pop;S.happy-=1;}
  if(S.has('wage')){income+=Math.floor(jobs/2);S.grain=Math.max(0,S.grain-1);}
  income+=8;S.treasury+=income;
  let h=0;if(S.count('school'))h+=2;if(S.count('clinic'))h+=1;if(S.count('well'))h+=1;if(S.has('langar')){h+=2;if(S.day%2===0)log(NOTES.seva);}if(S.has('women'))h+=2;if(S.has('watch'))h-=1;
  if(workers-jobs>8)h-=1;
  S.happy=Math.max(0,Math.min(100,S.happy+h));
  if(S.happy>=40){const growth=(S.count('house')>0?2:1)+(S.has('midday')&&S.count('school')?1:0)+(S.happy>=70?1:0);const cap=8+S.count('house')*8+(S.age>=2?10:0);S.pop=Math.min(cap,S.pop+growth);}
  spawnVillagers();
  S.approval=Math.round(S.happy*0.6+Math.min(40,(S.buildings.length-START_BUILT)*4)+(S.has('women')?8:0));
  S.petitions.forEach(p=>{p.days--;if(p.days<=0){const plot=PLOTS.find(x=>x.id===p.id);S.buildings.push({...plot,hp:1,under:true,start:S.day});log(`<b>${B[p.id].n} sanctioned</b> by the ${B[p.id].petition}. Work starts today.`);}});
  S.petitions=S.petitions.filter(p=>p.days>0);
  S.buildings.forEach(b=>{if(b.hp<1)b.hp=Math.min(1,b.hp+0.5);});
  if(S.reported.length){S.buildings.forEach(b=>{b.hp=1;});S.happy+=Math.min(3,S.reported.length);log(`<b>Because you reported ${S.reported.length} problem${S.reported.length>1?'s':''} last night,</b> the Panchayat had them seen to by dawn.`);S.reported=[];}
  if(S.subsidy){log(`<b>Resolution in force:</b> the treasury pays half of the ${B[S.subsidy].n.toLowerCase()} today.`);}
  checkAge();
  log(`<b>Dawn, day ${S.day}.</b> ${income} coins from ${jobs} workers went to the Panchayat treasury${report.length?'. '+report.join('. '):''}.`);
}
function checkAge(){const nx=AGES[S.age+1];if(!nx)return;if(S.pop>=nx.need.pop&&(nx.need.b||[]).every(id=>S.count(id)>0)){S.age++;log(S.age===1?NOTES.age1:NOTES.age2);screen(`<h2>${AGES[S.age].n}</h2><p>${AGES[S.age].unlock}</p><button id="ok">Continue</button>`);document.getElementById('ok').onclick=closeScreen;}}

// ---------- dusk: construction completes ----------
function dusk(){
  let n=0;S.buildings.forEach(b=>{if(b.under){b.under=false;n++;}});
  if(n)log(`<b>${n} construction${n>1?'s':''} finished</b> as the light went.`);
  nightfall();
  S.sabhaDone=false;S.reported=[];S.awake=S.nightLen*[0.25,0.6,1,1][S.rank];
  S.villagers.forEach(v=>{v.tx=PANCH.x+rnd(-70,70);v.ty=PANCH.y+rnd(50,110);v.wait=999;});
  log('<b>Lamps at the Panchayat Bhavan.</b> The village is gathering for the night Sabha.');
}
// ---------- the night Sabha ----------
function proposals(){
  const P=[];const has=k=>S.problems.some(p=>p.k===k);
  if(has('thief'))P.push({id:'watch',n:'Set a night watch on the fields',why:'Ramesh saw a stranger. Neighbours take turns tonight; a community matter.',by:'Ramesh',base:3,lead:2});
  if(has('flood'))P.push({id:'drain',n:'Dig a drain from the lower lane tonight',why:'The river is rising. Twenty people with spades before the water reaches the houses.',by:'Bhagwati',base:3,lead:1});
  if(has('plastic'))P.push({id:'cleanup',n:'Clean-up drive at first light',why:'Plastic by the temple road. Goats are eating it.',by:'Anita',base:2,lead:1});
  if(has('sick'))P.push({id:'doctor',n:'Send for the doctor from the block',why:'Fever in three houses near the well. The health sub-centre is a State function; until then, send a message.',by:'Meera Devi',base:3,lead:2});
  if(has('dispute'))P.push({id:'patwari',n:'Call the Patwari with the old map',why:'Two families are shouting at the field edge. Only the land record can settle it.',by:'Hari Singh',base:2,lead:1});
  const want=['school','market','well','road','clinic'].filter(id=>!S.buildings.some(b=>b.id===id)&&S.rank>=B[id].rank);
  want.slice(0,2).forEach(id=>P.push({id:'fund:'+id,n:`Spend treasury on the ${B[id].n.toLowerCase()}`,why:{school:'Suraj: the children walk two hours to the next village.',market:'Hari Singh: the middleman pays half. A market of our own.',well:'Meera Devi: the tank is dry by noon.',road:'Ramesh: the tractor sinks every monsoon.',clinic:'Bhagwati: the fever comes back every year.'}[id],by:{school:'Suraj',market:'Hari Singh',well:'Meera Devi',road:'Ramesh',clinic:'Bhagwati'}[id],base:2,lead:id==='road'?3:1}));
  if(P.length<2)P.push({id:'nothing',n:'No new resolution; keep the treasury',why:`${NPC_SARPANCH}: a quiet village should save.`,by:NPC_SARPANCH,base:1,lead:3});
  return P.slice(0,4);
}
function nightSabha(){
  const P=proposals();let voted=null;
  const filler=['The wheat is thin this year.','Nights are getting cold.','My cousin in the city says they have a Nagar Palika.','I want the meeting to end so I can sleep.','The goats got into the school yard again.','Someone should fix the lane by the well.'].sort(()=>Math.random()-.5);
  const talk=VILLAGERS.slice(0,S.pop>10?5:4).map(v=>{const pr=P.find(p=>p.by===v.n);return `<li class="talk"><b>${v.n}</b> <span class="tiny">(${v.job})</span><br>${pr?pr.why:filler.pop()}</li>`;}).join('');
  const votesHtml=()=>P.map((p,i)=>`<button class="pol vote${voted===i?' on':''}" data-i="${i}"><h3>${p.n}</h3><p>${p.why}</p><span class="src">raised by ${p.by}</span></button>`).join('');
  screen(`<h2>Night Sabha, day ${S.day}</h2><p class="sub">Lamps lit. ${S.rank>=2?'You chair the meeting.':NPC_SARPANCH+' chairs; you have '+'one vote, like every adult'+'.'}</p>
  <p><b>The village speaks.</b></p><ul class="talkers">${talk}</ul>
  <p><b>Proposals.</b> ${S.rank>=2?'Hear the vote, then decide.':'Cast your vote.'}</p><div class="policies" id="props">${votesHtml()}</div><button id="count" class="hidden">Count the votes</button>`,true);
  ov.querySelectorAll('.vote').forEach(b=>b.onclick=()=>{voted=+b.dataset.i;ov.querySelectorAll('.vote').forEach(x=>x.classList.toggle('on',+x.dataset.i===voted));document.getElementById('count').classList.remove('hidden');});
  document.getElementById('count').onclick=()=>{
    const tally=P.map(p=>p.base+Math.floor(Math.random()*4));tally[voted]+=1;
    const maj=tally.indexOf(Math.max(...tally));
    let html=`<h2>The count</h2><div class="stats">${P.map((p,i)=>`<span>${p.n}${i===voted?' (your vote)':''}</span><span>${tally[i]}</span>`).join('')}</div><p><b>Majority:</b> ${P[maj].n}.</p>`;
    if(S.rank>=2){html+=`<p>As Sarpanch the decision is yours. The majority is advice, not an order; the village will remember either way.</p><div class="policies">${P.map((p,i)=>`<button class="pol dec" data-i="${i}"><h3>${p.n}</h3><p>${i===maj?'Follow the majority.':'Overrule the majority. Approval falls a little, unless it turns out right.'}</p></button>`).join('')}</div>`;screen(html,true);ov.querySelectorAll('.dec').forEach(b=>b.onclick=()=>decide(P,+b.dataset.i,maj,true));}
    else{const follow=Math.random()<0.7;const pick=follow?maj:P.map((p,i)=>i).sort((a,b)=>P[b].lead-P[a].lead)[0];html+=`<p><b>${NPC_SARPANCH} decides:</b> ${P[pick].n}. ${pick===maj?'The majority carried it.':'The Sarpanch had other ideas. In this simplified game the chair can choose another proposal; real Panchayats must follow applicable rules and remain accountable to the Gram Sabha.'}</p><button id="ok">Leave the meeting</button>`;screen(html,true);document.getElementById('ok').onclick=()=>decide(P,pick,maj,false);}
  };
}
function applyResolution(id){
  const mark=k=>S.problems.forEach(p=>{if(p.k===k)p.mit=true;});
  if(id==='watch'){mark('thief');S.problems.forEach(p=>{if(p.k==='thief')p.flee=true;});}
  if(id==='drain'){mark('flood');}
  if(id==='cleanup'){S.problems=S.problems.filter(p=>p.k!=='plastic');S.happy+=1;}
  if(id==='doctor'){S.problems=S.problems.filter(p=>p.k!=='sick');S.happy+=1;}
  if(id==='patwari'){S.problems=S.problems.filter(p=>p.k!=='dispute');S.happy+=1;}
  if(id.startsWith('fund:')){S.subsidy=id.slice(5);}
}
function decide(P,pick,maj,mine){
  const p=P[pick];S.resolution=p.id;applyResolution(p.id);
  if(mine&&pick!==maj)S.happy-=2;if(mine&&pick===maj)S.happy+=1;
  log(`<b>Resolution:</b> ${p.n}.`);
  S.sabhaDone=true;closeScreen();
  S.villagers.forEach(v=>{v.wait=0;});
  if(S.rank>=2)log('<b>The night is yours.</b> Walk with the lantern, or go home and sleep.');
  else log(`<b>Lamps out soon.</b> You may walk with the lantern for ${Math.round(S.awake)} seconds, then villagers must be indoors.`);
}
function sabhaWithoutYou(){const P=proposals();const pick=P.map((p,i)=>i).sort((a,b)=>P[b].lead-P[a].lead)[0];applyResolution(P[pick].id);S.sabhaDone=true;S.happy-=2;log(NOTES.skipped+' '+P[pick].n+'.');}

// Paths: every finished building links to the nearest already-linked one, starting from the Bhavan, the chowk and the house.
function pathLinks(){
  const done=S.buildings.filter(b=>!b.under&&!['road','embank'].includes(b.id)&&b.x<RIVER.x);
  const chowk={x:VC.x,y:VC.y,id:'chowk'};
  const linked=[chowk],links=[];
  done.filter(b=>b.id==='panchayat'||b.id==='home').forEach(b=>{links.push([chowk,b]);linked.push(b);});
  const rest=done.filter(b=>!linked.includes(b)).sort((a,b)=>Math.hypot(a.x-VC.x,a.y-VC.y)-Math.hypot(b.x-VC.x,b.y-VC.y));
  rest.forEach(b=>{let best=null,bd=1e9;linked.forEach(l=>{const d=Math.hypot(l.x-b.x,l.y-b.y);if(d<bd){bd=d;best=l;}});if(best)links.push([best,b]);linked.push(b);});
  return links;
}

// ---------- nights ----------
function nightfall(){
  S.night++;const n=S.night;S.problems=[];
  const warn=S.has('bal');
  const add=p=>{S.problems.push(p);if(warn)log(`<b>The children report:</b> ${p.warn}`);};
  if(n%3===1&&S.dayThiefDone)add({k:'thief',x:150,y:700,warn:'a stranger near the fields.',t:0});
  if(n===2||n%4===2)add({k:'flood',x:RIVER.x-70,y:rnd(600,1300),r:0,warn:'the river is rising.',t:0,big:false});
  if(n===3||n%4===3)add({k:'plastic',x:VC.x+rnd(-160,160),y:1010,warn:'plastic piling by the road.',t:0});
  if(n>=4&&n%3===0)add({k:'sick',x:1040,y:900,warn:'fever in the houses near the well.',t:0});
  if(n>=3&&n%4===0&&FIELDS().length>=2){const f=FIELDS();add({k:'dispute',x:f[0].x+30,y:f[0].y+30,warn:'two families arguing at the field edge.',t:0});}
  if(n>=5&&n%2===1&&S.dayThiefDone)add({k:'thief',x:300,y:1650,warn:'another stranger, south side.',t:0});
}
function updateProblems(dt){
  const night=S.phase==='night';
  for(const p of S.problems){p.t+=dt;
    if(p.k==='thief'){
      if(!p.target){const f=FIELDS().filter(b=>b.hp>=1&&b.x<RIVER.x);p.target=f.length?f[Math.floor(Math.random()*f.length)]:null;if(!p.target){p.done=true;continue;}}
      if(night&&S.has('watch'))p.flee=true;
      if(night&&S.count('police')&&!p.met&&p.t>3){p.met=true;log(NOTES.thiefCaught);S.happy+=2;p.done=true;continue;}
      if(p.flee){const dx=p.x-VC.x,dy=p.y-VC.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*150*dt;p.y+=dy/d*150*dt;if(p.x<0||p.x>W||p.y<0||p.y>H)p.done=true;continue;}
      const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy);
      if(d>8){p.x+=dx/d*(p.day?55:70)*dt;p.y+=dy/d*(p.day?55:70)*dt;}
      else{p.steal=(p.steal||0)+dt;if(p.steal>4){S.grain=Math.max(0,S.grain-3);S.treasury=Math.max(0,S.treasury-8);S.happy-=4;log('<b>Grain stolen from the field.</b>');p.flee=true;}}
      const pd=Math.hypot(S.player.x-p.x,S.player.y-p.y);
      if(pd<26&&!p.met&&!S.asleep&&S.scene==='village'){p.met=true;if(p.day){log(NOTES.thiefDay);S.dayThiefDone=true;S.happy+=3;p.done=true;}else{log(NOTES.thiefNoPolice);p.flee=true;}}
    }
    if(p.k==='flood'){
      const rate=(S.has('rain')?8:16)*(S.count('embank')?0:1)*(p.mit?0.5:1);p.r+=rate*dt;
      if(p.r>60&&!p.big&&p.t>8){p.big=true;log(NOTES.floodBig);S.happy-=3;}
      if(!p.big&&p.t>1.5&&!p.said){p.said=true;log(NOTES.floodSmall);}
      if(S.count('well')&&!p.big){p.r-=14*dt;if(p.r<=0){p.done=true;continue;}}
      S.buildings.forEach(b=>{if(b.hp>=1&&!b.under&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+20){b.hp=0.4;log(`<b>${B[b.id].n} damaged</b> by the flood.`);}});
      if(p.t>16)p.done=true;
    }
    if(p.k==='plastic'){if(!p.said){p.said=true;log(NOTES.plastic);}if(S.count('bins')&&S.has('segregate')){p.done=true;S.happy+=1;}else if(p.t>10){S.happy-=3;p.done=true;}}
    if(p.k==='sick'){if(!p.said){p.said=true;log(NOTES.sick);}if(S.count('clinic')){p.done=true;S.happy+=1;}else if(p.t>10){S.pop=Math.max(3,S.pop-1);S.happy-=4;p.done=true;}}
    if(p.k==='dispute'){if(!p.said){p.said=true;log(NOTES.dispute);}if(S.count('patwari')){if(p.t>3){p.done=true;S.happy+=2;log(NOTES.disputeOk);}}else if(p.t>12){S.happy-=5;const f=FIELDS()[0];if(f)f.hp=0.4;p.done=true;log('<b>The quarrel became a fight.</b> A field was trampled and nobody knows whose it is.');}}
  }
  S.problems=S.problems.filter(p=>!p.done);
}

const DOOR_OFF={panchayat:44,home:34,homeM:40,homeS:44,house:33};

  const nightAmt=u<0.58?0:u<0.66?clamp01((u-0.58)/0.08):u<0.94?1:clamp01((1-u)/0.06);
  sun.color.copy(ds.sun);sun.intensity=ds.si*1.12;hemi.intensity=ds.hi*1.35;hemi.color.copy(ds.hs);
  setSky(ds.z,ds.h);scene.fog.color.copy(ds.h);stars.material.opacity=nightAmt*.85;
  const a=Math.min(1,u/0.6)*Math.PI;const sx=tx+Math.cos(a)*70,sy=38+Math.sin(a)*45;sun.position.set(sx+(tx-40-sx)*nightAmt,sy+(60-sy)*nightAmt,tz+30);sun.target.position.set(tx,0,tz);
  lantern.intensity=nightAmt*(S.asleep?0:2.6);lantern.position.set(U(p.x),3.2,U(p.y)+1.5);playerMesh.userData.lamp.visible=nightAmt>.3&&!S.asleep;
  bhavanLamp.intensity=nightAmt*(S.sabhaDone?0.9:2.4);M.window.emissiveIntensity=nightAmt*.9;M.lamp.color.setHex(nightAmt>.3?0xffd27a:0xcfc4a0);
  // hud
  const html=`<span class="pill rank"><b>${RANKS[S.rank].n}</b><span class="age">${AGES[S.age].n}</span></span><span class="pill"><span class="lbl">works budget</span><b>${S.coins}</b>${S.treasury?`<span class="plus">+${S.treasury} at Panchayat</span>`:''}</span><span class="pill"><span class="lbl">grain</span><b>${S.grain}</b><span class="lbl">people</span><b>${S.pop}</b><span class="lbl">happy</span><b>${S.happy}</b></span><span class="pill"><span class="lbl">approval</span><b>${S.approval}%</b></span>${S.problems.length?`<span class="pill warn">${S.problems.length} problem${S.problems.length>1?'s':''}</span>`:''}${S.phase==='night'&&S.sabhaDone&&!S.asleep&&S.rank<2?`<span class="pill"><span class="lbl">lamp</span><b>${Math.max(0,Math.ceil(S.awake))}s</b></span>`:''}`;
  if(html!==hudHtml){hudHtml=html;document.getElementById('hud').innerHTML=html;}
  const clock=document.getElementById('clock');clock.style.setProperty('--p',Math.round(S.t/len*100)+'%');clock.classList.toggle('night',S.phase==='night');document.getElementById('clockN').textContent=S.day;document.getElementById('clockP').textContent=S.phase;
}

/* ============================================================
   ROOMS · the Panchayat Bhavan and the houses as walkable interiors
   Solids are circles {x,z,r} or boxes {x,z,hw,hd}; walls are single-sided so the camera can sit outside.
   ============================================================ */
const ROOMS=new Map();window.ROOMS=ROOMS;
const RM={floor:mat(0xa88f6a),floor2:mat(0xb9a37c),floorS:mat(0xc9b08a),wall:mat(0xdccbab),wallDark:mat(0xcbb893),wallBlue:mat(0xb7c9d6),wallGreen:mat(0xcfd9bd),wood:mat(0x7a5a3a),wood2:mat(0x9a7a4a),paper:mat(0xf4efe3),cloth:mat(0xc8552e),cloth2:mat(0x4a7fb5),cloth3:mat(0xe0a63c),chest:mat(0x6b4a2b),gold:mat(0xe0a63c),clay:mat(0xa0623c),green:mat(0x5f9b52),dark:mat(0x2b2b2b),brass:mat(0xc9a44a)};
function roomFor(b){let r=ROOMS.get(b);if(r)return r;r=buildRoom(b);r.doorSpot={key:'door',html:()=>'<h4>Door</h4><p>Back out to the village.</p><button id="hsb">Leave</button>',act:()=>leaveRoom()};ROOMS.set(b,r);return r;}
function rect(x,z,hw,hd){return {x,z,hw,hd};}
function buildRoom(b){
  const type=b.id;const own=b===HOME;
  const W_=type==='panchayat'?20:type==='homeS'?14:type==='homeM'?12:9,D_=type==='panchayat'?14:type==='homeS'?10:type==='homeM'?9:8,Hh=3.6;
  const sc=new THREE.Scene();sc.background=new THREE.Color(0x141a26);

  const dl=new THREE.DirectionalLight(0xffffff,.45);dl.position.set(4,8,3);sc.add(dl);
  const lamp=new THREE.PointLight(0xffc880,.9,20,1.4);lamp.position.set(0,Hh-.4,0);sc.add(lamp);
  const g=new THREE.Group();sc.add(g);
  const wallM=type==='panchayat'?RM.wallGreen:type==='homeS'?RM.wall:type==='home'?RM.wallBlue:RM.wall;
  g.add(box(W_,.2,D_,type==='panchayat'?RM.floor:type==='homeS'?RM.floorS:RM.floor2,0,-.1,0));

  wall(W_,Hh,0,Hh/2,-D_/2,0,wallM);wall(D_,Hh,-W_/2,Hh/2,0,Math.PI/2,RM.wallDark);wall(D_,Hh,W_/2,Hh/2,0,-Math.PI/2,RM.wallDark);
  const sw=(W_-2)/2;wall(sw,Hh,-(1+sw/2),Hh/2,D_/2,Math.PI,wallM);wall(sw,Hh,(1+sw/2),Hh/2,D_/2,Math.PI,wallM);wall(2.2,.5,0,Hh-.25,D_/2,Math.PI,wallM);
  g.add(box(.15,Hh-.5,.36,RM.wood,-1.05,(Hh-.5)/2,D_/2));g.add(box(.15,Hh-.5,.36,RM.wood,1.05,(Hh-.5)/2,D_/2));
  g.add(box(W_+.3,.14,.28,RM.wood,0,Hh+.02,-D_/2));g.add(box(W_+.3,.14,.28,RM.wood,0,Hh+.02,D_/2));g.add(box(.28,.14,D_,RM.wood,-W_/2,Hh+.02,0));g.add(box(.28,.14,D_,RM.wood,W_/2,Hh+.02,0));
  // a painted band along the floor, as village walls have
  g.add(box(W_,.5,.06,type==='panchayat'?RM.cloth3:RM.clay,0,.25,-D_/2+.04));g.add(box(.06,.5,D_,type==='panchayat'?RM.cloth3:RM.clay,-W_/2+.04,.25,0));g.add(box(.06,.5,D_,type==='panchayat'?RM.cloth3:RM.clay,W_/2-.04,.25,0));
  const winAt=(x,z,ry)=>{const w=new THREE.Group();w.position.set(x,1.9,z);w.rotation.y=ry;w.add(box(1.3,1.1,.12,RM.wood,0,0,0));w.add(new THREE.Mesh(new THREE.BoxGeometry(1.05,.85,.08),M.window));g.add(w);};
  const solids=[],hot=[];
  const bulb=(x,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.15,6,5),M.lamp);m.position.set(x,Hh-.5,z);g.add(m);};
  if(type==='panchayat'){
    winAt(-5,-D_/2+.16,0);winAt(5,-D_/2+.16,0);winAt(-W_/2+.16,-2.5,Math.PI/2);winAt(W_/2-.16,-2.5,Math.PI/2);winAt(-W_/2+.16,2.5,Math.PI/2);winAt(W_/2-.16,2.5,Math.PI/2);
    // the map table at the north end
    g.add(box(6.4,.15,2.2,RM.wood2,0,.9,-3.6));for(const [x,z] of [[-3,-4.5],[3,-4.5],[-3,-2.7],[3,-2.7]])g.add(box(.18,.9,.18,RM.wood,x,.45,z));
    g.add(box(4.6,.05,1.5,RM.paper,0,.99,-3.6));
    [[-1.5,-.3,M.roofRed],[-.6,-.5,M.roofGold],[.6,-.2,M.roofBlue],[1.4,.3,M.wheat],[-1,.4,M.leaf],[.2,.45,M.orange]].forEach(([x,z,m])=>g.add(box(.35,.04,.28,m,x,1.03,-3.6+z)));
    g.add(box(.05,.06,1.4,M.water,2,1.03,-3.6));
    solids.push(rect(0,-3.6,3.3,1.2));
    // the chair behind it
    g.add(box(.9,.1,.9,RM.wood,0,.5,-5.5));g.add(box(.9,1.1,.12,RM.wood,0,1.05,-5.9));g.add(box(.7,.15,.7,RM.cloth,0,.58,-5.5));solids.push(rect(0,-5.6,.5,.5));
    // treasury chest at the west wall
    g.add(box(1.6,.9,1,RM.chest,-8.6,.45,-4.4));g.add(box(1.6,.25,1,RM.gold,-8.6,1.0,-4.4));g.add(box(.3,.3,.1,RM.dark,-8.6,.6,-3.88));solids.push(rect(-8.6,-4.4,.9,.6));
    // notice board at the east wall
    g.add(box(.1,1.4,2.2,RM.wood,W_/2-.2,1.9,-1));g.add(box(.05,1.1,1.9,RM.paper,W_/2-.26,1.9,-1));g.add(box(.04,.5,.7,RM.cloth2,W_/2-.29,2.05,-1.4));g.add(box(.04,.3,.6,RM.gold,W_/2-.29,1.6,-.5));
    // benches: three rows, two columns, a wide aisle down the middle
    for(let r=0;r<3;r++)for(let c=-1;c<=1;c+=2){const z=.4+r*2.0,x=c*3.7;g.add(box(4.2,.12,.5,RM.wood2,x,.45,z));g.add(box(.15,.45,.45,RM.wood,x-1.8,.22,z));g.add(box(.15,.45,.45,RM.wood,x+1.8,.22,z));solids.push(rect(x,z,2.1,.3));}
    const l2=new THREE.PointLight(0xffc880,.8,16,1.4);l2.position.set(0,Hh-.4,-4);sc.add(l2);bulb(0,0);bulb(0,-4);
    // a portrait and a calendar on the north wall
    g.add(box(.9,1.1,.06,RM.wood,-2.5,2.3,-D_/2+.1));g.add(box(.7,.9,.02,RM.paper,-2.5,2.3,-D_/2+.14));g.add(box(.6,.8,.06,RM.paper,2.6,2.2,-D_/2+.1));g.add(box(.6,.2,.02,RM.cloth,2.6,2.5,-D_/2+.14));
    const clerk=person(M.cloths[4],.85);clerk.position.set(-7.2,0,-3);clerk.rotation.y=Math.PI/2;g.add(clerk);solids.push({x:-7.2,z:-3,r:.55});
    const seated=[];for(let r=0;r<3;r++)for(let c=-1;c<=1;c+=2)for(let k=-1;k<=1;k++){const v=person(M.cloths[(r*3+k+4)%8],.72);v.position.set(c*3.7+k*1.3,.2,.4+r*2.0);v.rotation.y=Math.PI;g.add(v);seated.push(v);}
    const kamla=person(M.cloths[5],.85);kamla.position.set(0,0,-4.9);g.add(kamla);
    const clerkWho={n:'Bansi Lal',job:'Panchayat secretary'};
    hot.push({key:'chest',x:-7.4,z:-4,r:2.3,html:()=>`<h4>Treasury chest</h4><p>${S.collected?'Empty until dawn. The night\'s income comes here.':S.treasury+' coins from the village, held for the Panchayat.'}</p>${S.collected?'':'<button id="hsb">Collect</button>'}`,act:()=>{if(S.rank<1){window.VillageLife?.locked();return;}if(!S.collected){S.coins+=S.treasury;log(`<b>Collected ${S.treasury} coins</b> from the Panchayat treasury.`);S.treasury=0;S.collected=true;}}});
    hot.push({key:'clerk',x:-6.6,z:-2.4,r:1.6,html:()=>`<h4>${clerkWho.n} <span class="tiny">(${clerkWho.job})</span></h4><p>Keeps the minutes and the keys.</p><button id="hsb">Talk</button>`,act:()=>{S.talking={who:clerkWho,line:S.collected?'The map is on the table. Plan well; the Sabha reads the accounts.':'The chest holds '+S.treasury+' coins. Every rupee is written in this register.',t:5};}});
    hot.push({key:'table',x:0,z:-2,r:2.4,html:()=>S.phase==='day'?`<h4>The land map</h4><p>Lakshmanpur on paper. Plan today's work.</p><button id="hsb">Open the map</button>`:`<h4>The land map</h4><p>Too dark to plan. Wait for morning.</p>`,act:()=>{if(S.phase==='day')visitPanchayat();}});
    hot.push({key:'seat',x:0,z:3.4,r:1.9,html:()=>S.phase==='night'&&!S.sabhaDone?`<h4>Night Sabha</h4><p>The village is seated. Take your place.</p><button id="hsb">Take your seat</button>`:`<h4>The hall</h4><p>${S.phase==='night'?'The meeting is over. Lamps burn low.':'Benches for the Gram Sabha. Every adult has a seat.'}</p>`,act:()=>{if(S.phase==='night'&&!S.sabhaDone)nightSabha();}});
    hot.push({key:'board',x:W_/2-1.3,z:-1,r:1.9,html:()=>`<h4>Notice board</h4><p>${S.policies.length?'Resolutions in force: '+S.policies.map(id=>POLICIES.find(p=>p.id===id).n).join(', ')+'.':'No resolutions yet. The Sabha meets every third morning.'}</p>`});
    const room={scene:sc,W:W_,D:D_,solids,hotspots:hot,building:b,name:'Panchayat Bhavan'};
    room.update=()=>{const night=S.phase==='night';clerk.visible=!night;const meeting=night&&!S.sabhaDone;seated.forEach(v=>v.visible=meeting);kamla.visible=meeting&&S.rank<2;};
    return room;
  }
  // houses: a bed, a shelf, a stove, a rug, water pots; bigger houses get a desk and a divan
  const bx=-W_/2+1.6,bz=-D_/2+1.9;
  winAt(0,-D_/2+.16,0);winAt(W_/2-.16,-1,Math.PI/2);
  g.add(box(2.2,.5,1.2,RM.wood2,bx,.3,bz));g.add(box(2.1,.25,1.1,own?RM.cloth2:RM.cloth,bx,.65,bz));g.add(box(.6,.2,.9,RM.paper,bx-.7,.85,bz));solids.push(rect(bx,bz,1.1,.6));
  g.add(box(.5,1.6,1.6,RM.wood,W_/2-.45,.8,-2.4));g.add(box(.4,.3,.3,RM.clay,W_/2-.45,1.75,-2.6));g.add(box(.3,.25,.25,RM.paper,W_/2-.45,1.75,-2.1));solids.push(rect(W_/2-.45,-2.4,.3,.85));
  const sx=W_/2-1.3,sz=-D_/2+.9;g.add(box(1.2,.6,1,RM.clay,sx,.3,sz));g.add(box(.6,.4,.6,RM.dark,sx,.8,sz));solids.push(rect(sx,sz,.65,.55));
  g.add(box(3,.04,2,own?RM.cloth:RM.green,.4,.02,.9));g.add(box(.7,.35,.7,RM.wood,1.6,.18,-1));solids.push(rect(1.6,-1,.38,.38));
  g.add(box(.5,.6,.5,RM.clay,-W_/2+1.2,.3,D_/2-1));g.add(box(.45,.5,.45,RM.clay,-W_/2+1.8,.25,D_/2-1));
  bulb(0,0);
  if(type==='homeM'||type==='homeS'){const dx=W_/2-2.6,dz=-D_/2+2.4;g.add(box(2.2,.1,1,RM.wood2,dx,.9,dz));for(const [a,c] of [[-1,-.4],[1,-.4],[-1,.4],[1,.4]])g.add(box(.12,.9,.12,RM.wood,dx+a,.45,dz+c));g.add(box(.6,.04,.4,RM.paper,dx-.3,.97,dz));g.add(box(.25,.35,.25,RM.brass,dx+.7,1.1,dz-.2));g.add(box(.6,.1,.6,RM.wood,dx,.5,dz+1.2));solids.push(rect(dx,dz,1.15,.55));
    hot.push({key:'desk',x:dx,z:dz+1.4,r:1.6,html:()=>`<h4>Writing desk</h4><p>${own?'Your papers as '+RANKS[S.rank].n+'. '+RANKS[S.rank].can:'Papers of the '+B[type].n.toLowerCase()+'.'}</p>`});}
  if(type==='homeS'){g.add(box(2.6,.5,1.1,RM.wood2,-1.5,.3,D_/2-2.2));g.add(box(2.5,.25,1,RM.cloth3,-1.5,.65,D_/2-2.2));solids.push(rect(-1.5,D_/2-2.2,1.3,.55));g.add(box(.7,.9,.06,RM.wood,-3,2.2,-D_/2+.1));g.add(box(.55,.75,.02,RM.paper,-3,2.2,-D_/2+.14));g.add(box(.6,.3,.35,RM.dark,W_/2-.45,1.75,-1.8));}
  let name='Your house';const resident=own?null:residentOf(b);
  if(resident){name=resident.n+"'s house";const rp=person(M.cloths[(Math.abs(b.x*7+b.y)%8)],.85);rp.position.set(.8,0,-.4);rp.rotation.y=Math.PI;g.add(rp);solids.push({x:.8,z:-.4,r:.6});
    hot.push({key:'talk',x:.8,z:-.4,r:2.4,html:()=>`<h4>${resident.n} <span class="tiny">(${resident.job})</span></h4><p>At home.</p><button id="hsb">Talk</button>`,act:()=>{S.talking={who:resident,line:talkLine(resident),t:5.5};}});}
  else{hot.push({key:'bed',x:bx+.4,z:bz+1,r:2,html:()=>S.phase==='night'?(S.sabhaDone?`<h4>Your bed</h4><p>Sleep. The night passes; the village fends for itself.</p><button id="hsb">Sleep</button>`:`<h4>Your bed</h4><p>Not yet. The Sabha is waiting at the Panchayat.</p>`):`<h4>Your bed</h4><p>Not tired. The Panchayat is past the banyan.</p>`,act:()=>{if(S.phase==='night'&&S.sabhaDone)sleep(false);}});
    hot.push({key:'stove',x:sx,z:sz+1.3,r:1.6,html:()=>`<h4>Stove</h4><p>${S.grain>0?S.grain+' sacks of grain in the village store for tomorrow\'s rotis.':'The store is empty. People will go hungry at dawn.'}</p>`});}
  const room={scene:sc,W:W_,D:D_,solids,hotspots:hot,building:b,name};room.update=()=>{};
  return room;
}
const fadeEl=document.getElementById('fade'),placeEl=document.getElementById('place');
function fadeTo(fn){S.transition=true;fadeEl.classList.add('on');setTimeout(()=>{fn();setTimeout(()=>{fadeEl.classList.remove('on');S.transition=false;},80);},320);}
function movePlayerTo(sc){if(playerMesh.parent)playerMesh.parent.remove(playerMesh);sc.add(playerMesh);}
function enterRoom(b){if(S.transition||S.scene!=='village')return;closePrompt();S.talking=null;fadeTo(()=>{const r=roomFor(b);S.scene='interior';S.room=r;S.inside={x:0,z:r.D/2-1.8,face:Math.PI};S.player.jy=0;S.player.vy=0;movePlayerTo(r.scene);S.player.moving=false;cam.savedDist=cam.dist;cam.savedPitch=cam.pitch;cam.dist=10;cam.pitch=.68;placeEl.textContent=r.name;placeEl.classList.remove('hidden');});}
function leaveRoom(instant){if(S.scene!=='interior')return;const go=()=>{const b=S.room.building;S.scene='village';S.room=null;S.talking=null;S.player.x=b.x;S.player.y=b.y+DOOR_OFF[b.id]+6;S.player.face=0;S.player.jy=0;S.player.vy=0;movePlayerTo(scene);if(cam.savedDist)cam.dist=cam.savedDist;if(cam.savedPitch!==undefined)cam.pitch=cam.savedPitch;placeEl.classList.add('hidden');};closePrompt();if(instant)go();else fadeTo(go);}
window.enterRoom=enterRoom;window.leaveRoom=leaveRoom;window.cam=cam;
function draw(){sync();if(S.scene==='interior'){S.room.update();renderer.render(S.room.scene,camera);}else renderer.render(scene,camera);}
function step(sec){const n=Math.round(sec*20);for(let i=0;i<n;i++){if(!S.paused)tick(0.05);}draw();}
window.step=step;window.S=S;window.act=act;window.PLOTS=PLOTS;window.B=B;window.visitPanchayat=visitPanchayat;window.sleep=sleep;window.nightSabha=nightSabha;window.PANCH=PANCH;window.homeOf=()=>HOME;window.DOOR_OFF=DOOR_OFF;window.VC=VC;window.moveHome=moveHome;window.pitchMin=pitchMin;window.talkLine=talkLine;
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!S.paused)tick(dt);draw();requestAnimationFrame(frame);}
